[package]
name = "padlock-cli"
description = "CLI interface for the Padlock credential manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "padlock"
path = "src/main.rs"

[dependencies]
padlock-core = { path = "../padlock-core" }

# CLI framework
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# Error handling
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal"] }

# Password input
rpassword = "7.3"

# Directory paths
dirs = "5.0"

# Serialization for --json output
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"

# Terminal colors
colored = "3.0"

# Configuration
toml = "0.8"

# Time parsing for audit
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[lints]
workspace = true
