[workspace]
resolver = "2"
members = [
    "crates/padlock-core",
    "crates/padlock-cli",
    "crates/padlock-test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padlock-dev/padlock"
authors = ["Padlock Contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

# Optimize crypto crates even in debug builds to avoid 5-8x slowdown
# in Argon2id KDF (16s → 2-3s on Apple Silicon M1).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.test]
opt-level = 1
